name: Sync with upstream core pup

on:
  schedule:
    - cron: "23 4 * * 1" # weekly, Mondays
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync script
        run: |
          git config user.name "txindex-bot"
          git config user.email "actions@github.com"
          bash scripts/sync-upstream.sh
          if git diff --quiet; then
            echo "No changes."
          else
            VERSION=$(python3 -c "import json;print(json.load(open('core-txindex/manifest.json'))['meta']['version'])")
            git add -A
            git commit -m "chore: sync upstream core pup (txindex re-applied) [v${VERSION}]"
            git tag "v${VERSION}"
            git push origin main --tags
          fi
